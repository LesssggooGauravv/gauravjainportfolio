<head>

<meta property="og:description" content="Software & AI/ML engineer building intelligent systems that scale.">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230a0e0a%22/><text x=%2250%22 y=%2270%22 font-size=%2264%22 text-anchor=%22middle%22 fill=%22%2333ff66%22 font-family=%22monospace%22>&gt;_</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e0a;
    --green:#33ff66;
    --green-dim:#1a4d2e;
    --green-panel:#0f1f13;
    --green-bright:#7dff9a;
    --amber:#ffb000;
    --off:#d7e8da;
    --red:#ff4444;
    --border:#24412e;
    --pixel:'Press Start 2P', monospace;
    --term:'VT323', monospace;
  }

  *{box-sizing:border-box;}

  /* custom CRT-dot cursor, replaces the system pointer on desktop */
  html,body,*,*::before,*::after{ cursor:none !important; }
  #cursor{
    position:fixed;
    top:0;
    left:0;
    width:8px;
    height:8px;
    background:var(--green);
    border-radius:50%;
    pointer-events:none;
    z-index:10001;
    transform:translate(-50%,-50%);
    transition:width .25s ease,height .25s ease,box-shadow .25s ease;
  }
  #cursor::before{
    content:"";
    position:absolute;
    top:50%; left:50%;
    width:22px; height:22px;
    border:2px solid rgba(255,255,255,.85);
    border-radius:50%;
    transform:translate(-50%,-50%);
    transition:width .25s ease,height .25s ease,border-color .25s ease;
  }
  #cursor.hover{
    width:12px;
    height:12px;
    box-shadow:0 0 10px rgba(51,255,102,.45);
  }
  #cursor.hover::before{
    width:34px;
    height:34px;
    border-color:#fff;
  }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--bg);
    font-family:var(--term);
    color:var(--green);
    overflow:hidden;
    -webkit-font-smoothing:none;
  }

  ::selection{background:var(--green);color:#000;}

  /* ---------- CRT / scanline overlay ---------- */
  #crt{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9999;
    background:
      repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0px,rgba(0,0,0,.18) 1px,transparent 2px,transparent 3px),
      radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(0,0,0,.55) 100%);
    mix-blend-mode:multiply;
  }
  #crt::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,0) 4%);
    animation:flicker 6.5s infinite;
  }
  @keyframes flicker{
    0%,100%{opacity:1;}
    92%{opacity:1;}
    93%{opacity:.85;}
    94%{opacity:1;}
    96%{opacity:.9;}
    97%{opacity:1;}
  }
  #flicker{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9998;
    background:rgba(51,255,102,.02);
    animation:flick 6s infinite;
  }
  @keyframes flick{
    0%,97%,100%{opacity:0;}
    98%{opacity:1;}
    99%{opacity:0;}
  }

  @media (prefers-reduced-motion:reduce){
    #crt::after,#flicker{animation:none;}
  }

  /* ---------- BOOT SCREEN ---------- */
  #boot{
    position:fixed;
    inset:0;
    background:#000;
    color:var(--green);
    z-index:10000;
    padding:28px 32px;
    font-size:20px;
    line-height:1.5;
    white-space:pre-wrap;
    overflow:hidden;
  }
  #boot .cursor-blink{
    animation:blink 1s step-start infinite;
  }
  @keyframes blink{50%{opacity:0;}}
  #boot.hide{display:none;}
  #skip-boot{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    min-width:230px;
    z-index:10001;
    font-family:var(--term);
    color:var(--off);
    background:transparent;
    border:1px solid var(--green-dim);
    padding:10px 22px 12px;
    text-align:center;
    transition:border-color .25s ease,transform .25s ease,background .25s ease;
  }
  #skip-boot:hover{
    color:var(--green);
    border-color:var(--green);
    background:rgba(51,255,102,.04);
    transform:translateX(-50%) scale(1.04);
  }
  .boot-system{
    display:block;
    font-family:var(--pixel);
    font-size:11px;
    color:var(--green-bright);
    margin-bottom:10px;
  }
  .boot-action{
    display:block;
    font-family:var(--pixel);
    font-size:10px;
    animation:bootPulse 1.5s ease-in-out infinite;
  }
  .boot-hint{
    display:block;
    margin-top:8px;
    color:#54735c;
    font-size:13px;
  }
  @keyframes bootPulse{
    0%,100%{opacity:.45;}
    50%{opacity:1;}
  }

  /* ---------- DESKTOP ---------- */
  #desktop{
    position:relative;
    width:100%;
    height:100vh;
    background:
      linear-gradient(rgba(51,255,102,.035) 1px,transparent 1px) 0 0/100% 28px,
      var(--bg);
    padding:22px;
    opacity:0;
    pointer-events:none;
    transition:opacity .9s ease;
  }
  #desktop.show{
    opacity:1;
    pointer-events:auto;
  }

  /* ---------- DESKTOP ICONS ---------- */
  .icon-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,92px);
    gap:22px 10px;
    width:fit-content;
  }
  .icon{
    width:92px;
    text-align:center;
    user-select:none;
    padding:6px 2px;
    border:1px solid transparent;
  }
  .icon:hover,.icon:focus{
    border:1px dotted var(--green-dim);
    outline:none;
  }
  .icon .glyph{
    font-size:34px;
    line-height:1;
    margin-bottom:6px;
    filter:drop-shadow(2px 2px 0 var(--green-dim));
  }
  .icon .label{
    font-family:var(--term);
    font-size:16px;
    color:var(--off);
    word-break:break-word;
  }
  .icon:hover .label{color:var(--amber);}

  /* ---------- WINDOWS ---------- */
  .win{
    position:absolute;
    min-width:300px;
    background:var(--bg);
    border:2px solid var(--green);
    box-shadow:6px 6px 0 rgba(0,0,0,.6);
    display:flex;
    flex-direction:column;
    z-index:100;
  }
  .win.active{
    border-color:var(--amber);
    box-shadow:6px 6px 0 rgba(0,0,0,.75);
    z-index:500;
  }
  .win .titlebar{
    background:var(--green-dim);
    color:var(--off);
    font-family:var(--pixel);
    font-size:11px;
    padding:8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    user-select:none;
    border-bottom:2px solid var(--green);
  }
  .win.active .titlebar{background:#264d33;}
  .win .titlebar .tb-title{
    display:flex;
    align-items:center;
    gap:8px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .win .titlebar .tb-btns{display:flex;gap:6px;flex-shrink:0;}
  .win .titlebar button{
    font-family:var(--pixel);
    font-size:10px;
    background:var(--bg);
    color:var(--green);
    border:1px solid var(--green);
    width:22px;
    height:20px;
    line-height:1;
    padding:0;
  }
  .win .titlebar button:hover{background:var(--red);color:#000;border-color:var(--red);}
  .win .titlebar button.min-btn:hover{background:var(--amber);border-color:var(--amber);}
  .win-body{
    padding:18px 20px;
    overflow-y:auto;
    font-size:19px;
    line-height:1.5;
    background:
      linear-gradient(rgba(51,255,102,.02) 1px,transparent 1px) 0 0/100% 24px,
      var(--bg);
  }
  .win-body::-webkit-scrollbar{width:12px;}
  .win-body::-webkit-scrollbar-track{background:var(--green-panel);}
  .win-body::-webkit-scrollbar-thumb{background:var(--green-dim);border:2px solid var(--bg);}
  .win-body h2{
    font-family:var(--pixel);
    font-size:14px;
    color:var(--amber);
    margin:0 0 16px;
    letter-spacing:1px;
  }
  .win-body h3{
    font-family:var(--term);
    font-size:22px;
    color:var(--off);
    margin:18px 0 4px;
    border-bottom:1px dashed var(--green-dim);
    padding-bottom:4px;
  }
  .win-body .meta{color:var(--green-dim);font-size:16px;margin-bottom:8px;}
  .win-body ul{margin:6px 0 14px;padding-left:22px;}
  .win-body li{margin-bottom:6px;}
  .win-body a{color:var(--amber);text-decoration:none;border-bottom:1px dotted var(--amber);}
  .win-body a:hover{background:var(--amber);color:#000;}
  .tag{
    display:inline-block;
    border:1px solid var(--green-dim);
    color:var(--green);
    padding:1px 8px;
    margin:3px 4px 3px 0;
    font-size:16px;
  }
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .bar-label{width:130px;flex-shrink:0;font-size:17px;}
  .bar-track{flex:1;height:14px;border:1px solid var(--green-dim);background:var(--green-panel);}
  .bar-fill{height:100%;background:repeating-linear-gradient(90deg,var(--green) 0 6px,var(--green-dim) 6px 8px);}
  .proj-card{border:1px solid var(--green-dim);padding:12px 14px;margin-bottom:14px;}
  .proj-card h3{border:none;margin:0 0 6px;}
  .proj-card .stat{color:var(--amber);}
  .resize-handle{
    position:absolute;
    right:0;
    bottom:0;
    width:16px;
    height:16px;
    background:repeating-linear-gradient(135deg,var(--green-dim) 0 2px,transparent 2px 4px);
  }

  /* ---------- TERMINAL ---------- */
  .term-body{
    background:#000;
    padding:14px 16px;
    font-size:19px;
    overflow-y:auto;
    flex:1;
  }
  .term-line{white-space:pre-wrap;word-break:break-word;margin:0;}
  .term-input-row{display:flex;align-items:center;}
  .term-prompt{color:var(--amber);margin-right:8px;flex-shrink:0;}
  .term-input{
    background:transparent;
    border:none;
    outline:none;
    color:var(--green);
    font-family:var(--term);
    font-size:19px;
    flex:1;
    caret-color:var(--green);
  }

  /* ---------- TASKBAR + START MENU ---------- */
  #taskbar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:44px;
    background:var(--green-panel);
    border-top:2px solid var(--green);
    display:flex;
    align-items:center;
    padding:0 10px;
    gap:8px;
    z-index:2000;
    font-family:var(--pixel);
    font-size:11px;
  }
  #start-btn{
    background:var(--green-dim);
    color:var(--off);
    border:1px solid var(--green);
    padding:9px 14px;
    font-family:var(--pixel);
    font-size:11px;
  }
  #start-btn:hover,#start-btn.open{background:var(--amber);color:#000;border-color:var(--amber);}
  #open-tabs{display:flex;gap:6px;flex:1;overflow-x:auto;}
  .taskbar-tab{
    background:var(--bg);
    border:1px solid var(--green-dim);
    color:var(--green);
    padding:9px 10px;
    font-family:var(--term);
    font-size:15px;
    white-space:nowrap;
    max-width:180px;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .taskbar-tab.active{border-color:var(--amber);color:var(--amber);}
  #clock{color:var(--off);font-family:var(--term);font-size:16px;border-left:1px solid var(--green-dim);padding-left:12px;white-space:nowrap;}
  #start-menu{
    position:fixed;
    left:10px;
    bottom:48px;
    width:235px;
    background:var(--bg);
    border:2px solid var(--green);
    box-shadow:6px 6px 0 rgba(0,0,0,.6);
    z-index:2001;
    display:none;
    flex-direction:column;
  }
  #start-menu.open{display:flex;}
  #start-menu .sm-head{background:var(--green-dim);color:var(--off);font-family:var(--pixel);font-size:11px;padding:10px;}
  #start-menu button{background:none;border:none;color:var(--green);text-align:left;font-family:var(--term);font-size:18px;padding:9px 14px;border-bottom:1px solid var(--green-panel);}
  #start-menu button:hover{background:var(--green-dim);color:var(--amber);}

  ::-webkit-scrollbar{width:12px;height:12px;}
  ::-webkit-scrollbar-track{background:var(--green-panel);}
  ::-webkit-scrollbar-thumb{background:var(--green-dim);border:2px solid var(--bg);}

  @media(max-width:760px){
    .win{position:fixed !important;left:2vw !important;top:64px !important;width:96vw !important;height:70vh !important;}
    .icon-grid{grid-template-columns:repeat(auto-fill,78px);}
    .icon .label{font-size:14px;}
    #clock{display:none;}
    .bar-label{width:96px;font-size:14px;}
  }

  @media(pointer:coarse){
    html,body,*,*::before,*::after{cursor:auto !important;}
    #cursor{display:none;}
  }

  /* visible keyboard focus, on top of the .icon dotted-border treatment */
  a:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--amber); outline-offset:2px;
  }
</style>
</head>

<template id="tpl-skills">

<script>
(function(){

    leetcode:'https://leetcode.com/u/lesssggoogauravv',
    email:'gauravjain20001643@gmail.com'
  };

  const taglines = [
    'Engineer at the intersection of software and AI.',
    'Software engineer specializing in AI/ML, building intelligent systems from idea to production.',
    'Software & AI/ML engineer building intelligent systems that scale.'

  const apps = {
    about:      {title:'ABOUT.TXT',      icon:'📄', w:560, h:500},
    experience: {title:'EXPERIENCE.LOG', icon:'🧾', w:650, h:500},
    projects:   {title:'PROJECTS/',      icon:'📁', w:700, h:600},
    skills:     {title:'SKILLS.SYS',     icon:'⚙',  w:610, h:520},
    education:  {title:'EDUCATION.DAT',  icon:'🎓', w:540, h:340},
    contact:    {title:'CONTACT.SH',     icon:'✉',  w:520, h:340},
    terminal:   {title:'TERMINAL.EXE',   icon:'▓',  w:640, h:460},
    resume:     {title:'RESUME.PDF',     icon:'⇩',  w:380, h:220}
  };

  const bootLines = [
    'root@jain v2.7.3 — LNMIIT-CCE build',
    'BIOS: Copyright (C) LNMIIT Labs — CGPA 7.30/10.00 detected',
    '',
    'Initializing hardware...',
    '  [OK] CPU ................ Python / C++ dual-core',

    '  /home/gaurav/projects ......... mounted (5 entries)',
    '  /home/gaurav/experience ....... mounted (Jio Platforms Ltd.)',
    '  /home/gaurav/thesis ........... mounted (GAN-based deepfake audio detection)',
    '',
    'Starting services...',
    '  systemd[1]: Started ml-engineering.service',
    '  systemd[1]: Started full-stack-shipping.service',
    '  systemd[1]: Started indic-language-ai.service',
    '',
    'Login: root@jain',
    'Loading root@jain desktop environment...'
  ];

  const FILES = {
    'about.txt':'Gaurav Jain — Software & AI/ML engineer building intelligent systems that scale.\\nFinal-year B.Tech CCE @ LNMIIT Jaipur (2023-2027). Focused on speech/audio ML, GANs, RAG, and edge deployment.',
    'experience.log':'Jio Platforms Limited — ML Intern, TTS for Indic Languages (Jun-Jul 2026)\\nScaled cross-lingual voice cloning to 22 Indian languages, 100 reference speakers, 6-stage dubbing pipeline.',
    'skills.sh':'Languages: Python, C++, Java, JavaScript, SQL, Bash\\nML: PyTorch, TensorFlow, Keras, HF Transformers, CNNs, GANs, TFLite, RAG\\nAudio: ASR, TTS, Voice Cloning, Diarization, Librosa, Torchaudio\\nFull-Stack: React, Node.js, Express, FastAPI, Tailwind',
    'education.md':'LNMIIT Jaipur — B.Tech CCE, 2023-2027, CGPA 7.3/10\\nBTP: GAN-Based Deepfake Audio Detection (ongoing), supervised by Dr. Priyanka Gupta',
    'contact.md':`email: ${LINKS.email}\\ngithub: ${LINKS.github}\\nlinkedin: ${LINKS.linkedin}\\nleetcode: ${LINKS.leetcode}`
  };
  const PROJECT_NAMES = ['voiceshield.md','stadium-setu.md','latex-lifestyle.md','gan-btp.md','phoneme-cnn.md'];

  const bootEl = document.getElementById('boot');
  const bootTextEl = document.getElementById('boot-text');
  const skipBtn = document.getElementById('skip-boot');
  const desktop = document.getElementById('desktop');
  const iconGrid = document.getElementById('icon-grid');
  const tabsEl = document.getElementById('open-tabs');
  const startBtn = document.getElementById('start-btn');
  const startMenu = document.getElementById('start-menu');
  const cursor = document.getElementById('cursor');

  const openWindows = {};
  let zTop = 100;
  let winOffset = 0;
  let bootDone = false;

  function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

  function finishBoot(){
    if(bootDone)return;
    bootDone = true;
    bootEl.classList.add('hide');
    skipBtn.style.display='none';
    desktop.classList.add('show');
    startClock();
    if(!openWindows.about) openApp('about');
  }

  function typeLine(line){
    return new Promise(resolve=>{
      let i=0;
      const row=document.createElement('div');
      bootTextEl.appendChild(row);
      const iv=setInterval(()=>{
        if(bootDone){clearInterval(iv);resolve();return;}
        row.textContent=line.slice(0,i+1);
        i++;
        if(i>line.length){clearInterval(iv);resolve();}
      },8);
    });
  }

  async function typeBoot(){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      bootTextEl.textContent = bootLines.join('\n');
      await sleep(600);
      if(!bootDone) finishBoot();
      return;
    }
    for(const line of bootLines){
      if(bootDone)return;
      await typeLine(line);
      await sleep(line===''?40:70);
    }
    await sleep(350);
    if(!bootDone)finishBoot();
  }

  skipBtn.addEventListener('click',finishBoot);
  document.addEventListener('keydown',e=>{
    if(!bootDone && (e.key==='Enter'||e.key===' '))finishBoot();
  });

  function startClock(){
    const clock=document.getElementById('clock');
    function tick(){
      const d=new Date();
      const pad=n=>String(n).padStart(2,'0');
      clock.textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }
    tick();
    setInterval(tick,1000);
  }

  function buildIcons(){
    Object.keys(apps).forEach(key=>{
      const a=apps[key];
      const div=document.createElement('div');
      div.className='icon';
      div.tabIndex=0;
      div.innerHTML=`<div class="glyph">${a.icon}</div><div class="label">${a.title}</div>`;
      div.addEventListener('dblclick',()=>openApp(key));
      div.addEventListener('keydown',e=>{if(e.key==='Enter')openApp(key);});
      let lastTap=0;
      div.addEventListener('touchend',()=>{
        const now=Date.now();
        if(now-lastTap<400)openApp(key);
        lastTap=now;
      });
      iconGrid.appendChild(div);
    });
  }

  startBtn.addEventListener('click',()=>{
    startMenu.classList.toggle('open');
    startBtn.classList.toggle('open');
  });
  startMenu.querySelectorAll('button[data-open]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      openApp(btn.dataset.open);
      startMenu.classList.remove('open');
      startBtn.classList.remove('open');
    });
  });
  document.addEventListener('click',e=>{
    if(!startMenu.contains(e.target)&&e.target!==startBtn){
      startMenu.classList.remove('open');
      startBtn.classList.remove('open');
    }
  });

  function addTab(key){
    if(document.getElementById('tab-'+key))return;
    const a=apps[key];
    const tab=document.createElement('div');
    tab.className='taskbar-tab';
    tab.id='tab-'+key;
    tab.textContent=a.icon+' '+a.title;
    tab.addEventListener('click',()=>{
      const win=openWindows[key];
      if(!win)return;
      if(win.style.display==='none')win.style.display='flex';
      focusWindow(key);
    });
    tabsEl.appendChild(tab);
    setActiveTab(key);
  }

  function removeTab(key){
    const tab=document.getElementById('tab-'+key);
    if(tab)tab.remove();
  }

  function setActiveTab(key){
    document.querySelectorAll('.taskbar-tab').forEach(t=>t.classList.remove('active'));
    const tab=document.getElementById('tab-'+key);
    if(tab)tab.classList.add('active');
  }

  function openApp(key){
    if(key==='resume'){
      downloadResume();
      return;
    }
    if(openWindows[key]){
      restoreWindow(key);
      focusWindow(key);
      return;
    }
    const a=apps[key];
    const win=document.createElement('div');
    win.className='win';

    if(window.innerWidth>760){
      winOffset=(winOffset+1)%6;
      win.style.left=(90+winOffset*32)+'px';
      win.style.top=(60+winOffset*28)+'px';
      win.style.width=a.w+'px';
      win.style.height=a.h+'px';
    }

    win.innerHTML=`
      <div class="titlebar">
        <div class="tb-title">${a.icon} ${a.title}</div>
        <div class="tb-btns">
          <button class="min-btn" title="minimize">_</button>
          <button class="close-btn" title="close">x</button>
        </div>
      </div>
      <div class="win-content" style="flex:1;display:flex;flex-direction:column;overflow:hidden;"></div>
      <div class="resize-handle"></div>
    `;
    desktop.appendChild(win);

    const content=win.querySelector('.win-content');
    if(key==='terminal'){
      buildTerminal(content);
    }else{
      const body=document.createElement('div');
      body.className='win-body';
      const tpl=document.getElementById('tpl-'+key);
      body.appendChild(tpl.content.cloneNode(true));
      content.appendChild(body);
      if(key==='about')startTaglineRotator(body);
    }

    makeDraggable(win,win.querySelector('.titlebar'));
    makeResizable(win);
    win.querySelector('.close-btn').addEventListener('click',e=>{e.stopPropagation();closeWindow(key);});
    win.querySelector('.min-btn').addEventListener('click',e=>{e.stopPropagation();minimizeWindow(key);});
    win.addEventListener('mousedown',()=>focusWindow(key));

    openWindows[key]=win;
    focusWindow(key);
    addTab(key);
  }

  function focusWindow(key){
    Object.keys(openWindows).forEach(k=>{
      if(openWindows[k])openWindows[k].classList.remove('active');
    });
    const win=openWindows[key];
    if(!win)return;
    zTop++;
    win.style.zIndex=zTop;
    win.classList.add('active');
    setActiveTab(key);
  }

  function closeWindow(key){
    const win=openWindows[key];
    if(win)win.remove();
    delete openWindows[key];
    removeTab(key);
  }

  function minimizeWindow(key){
    const win=openWindows[key];
    if(win)win.style.display='none';
    setActiveTab('');
  }

  function restoreWindow(key){
    const win=openWindows[key];
    if(win)win.style.display='flex';
  }

  function makeDraggable(win,handle){
    let ox=0,oy=0,dragging=false;
    handle.addEventListener('mousedown',e=>{
      if(window.innerWidth<=760)return;
      dragging=true;
      const rect=win.getBoundingClientRect();
      ox=e.clientX-rect.left;
      oy=e.clientY-rect.top;
      e.preventDefault();
    });
    window.addEventListener('mousemove',e=>{
      if(!dragging)return;
      let nx=e.clientX-ox;
      let ny=e.clientY-oy;
      nx=Math.max(0,Math.min(nx,window.innerWidth-80));
      ny=Math.max(22,Math.min(ny,window.innerHeight-64));
      win.style.left=nx+'px';
      win.style.top=ny+'px';
    });
    window.addEventListener('mouseup',()=>dragging=false);
  }

  function makeResizable(win){
    const handle=win.querySelector('.resize-handle');
    let resizing=false,sx=0,sy=0,sw=0,sh=0;
    handle.addEventListener('mousedown',e=>{
      if(window.innerWidth<=760)return;
      resizing=true;
      sx=e.clientX;sy=e.clientY;
      sw=win.offsetWidth;sh=win.offsetHeight;
      e.preventDefault();e.stopPropagation();
    });
    window.addEventListener('mousemove',e=>{
      if(!resizing)return;
      win.style.width=Math.max(300,sw+(e.clientX-sx))+'px';
      win.style.height=Math.max(200,sh+(e.clientY-sy))+'px';
    });
    window.addEventListener('mouseup',()=>resizing=false);
  }

  function startTaglineRotator(scope){
    const el=scope.querySelector('#tagline-rotator');
    if(!el)return;
    let i=0;
    let iv=null;
    let timeout=null;
    function show(){
      el.textContent='';
      const line=taglines[i];
      let c=0;
      iv=setInterval(()=>{
        el.textContent+=line[c++] || '';
        if(c>=line.length){
          clearInterval(iv);
          timeout=setTimeout(next,2200);
        }
      },28);
    }
    function next(){
      i=(i+1)%taglines.length;
      show();
    }
    show();
    scope._taglineCleanup=()=>{if(iv)clearInterval(iv);if(timeout)clearTimeout(timeout);};
  }

  function buildTerminal(content){
    const body=document.createElement('div');
    body.className='term-body';
    body.innerHTML=`
      <div id="term-output"></div>
      <div class="term-input-row">
        <span class="term-prompt">root@jain:~$</span>
        <input class="term-input" id="term-input" type="text" autocomplete="off" spellcheck="false">
      </div>
    `;
    content.appendChild(body);
    const output=body.querySelector('#term-output');
    const input=body.querySelector('#term-input');

    function print(text){
      const p=document.createElement('div');
      p.className='term-line';
      p.textContent=text;
      output.appendChild(p);
      body.scrollTop=body.scrollHeight;
    }
    function printHTML(html){
      const p=document.createElement('div');
      p.className='term-line';
      p.innerHTML=html;
      output.appendChild(p);
      body.scrollTop=body.scrollHeight;
    }

    print('root@jain');
    print('-----------');
    print('portfolio shell');
    print('');
    print("Type 'help' to explore.");
    print("Try 'neofetch' for system info.");

    const commands={
      help:()=>{
        print('Available commands:');
        print('  whoami         short bio');
        print('  about          open about.txt window');
        print('  ls             list files');
        print('  ls projects    list project files');
        print('  cat <file>     print a file');
        print('  projects       open projects window');
        print('  experience     open experience window');
        print('  education      open education window');
        print('  skills         open skills window');
        print('  contact        open contact window');
        print('  resume         download resume');
        print('  github / linkedin / leetcode / email');
        print('  neofetch       system info');
        print('  sudo <anything>');
        print('  clear          clear the screen');
      },
      whoami:()=>print('gaurav — Software & AI/ML engineer, LNMIIT Jaipur \'27. Speech ML, GANs, RAG, edge deployment.'),
      about:()=>{openApp('about');print('opening about.txt ...');},
      projects:()=>{openApp('projects');print('opening projects/ ...');},
      experience:()=>{openApp('experience');print('opening experience.log ...');},
      education:()=>{openApp('education');print('opening education.md ...');},
      skills:()=>{openApp('skills');print('opening skills.sh ...');},
      contact:()=>{openApp('contact');print('opening contact.md ...');},
      resume:()=>downloadResume(),
      github:()=>printHTML(`→ <a href="${LINKS.github}" target="_blank" rel="noopener">${LINKS.github}</a>`),
      linkedin:()=>printHTML(`→ <a href="${LINKS.linkedin}" target="_blank" rel="noopener">${LINKS.linkedin}</a>`),
      leetcode:()=>printHTML(`→ <a href="${LINKS.leetcode}" target="_blank" rel="noopener">${LINKS.leetcode}</a>`),
      email:()=>printHTML(`→ <a href="mailto:${LINKS.email}">${LINKS.email}</a>`),
      neofetch:()=>print('root@jain\\n-------------\\nOS: root@jain v2.7.3\\nHost: LNMIIT Jaipur, CCE \'27\\nCGPA: 7.3/10\\nShell: skills.sh\\nCore: Python, C++, PyTorch\\nUptime: since 2023'),
      clear:()=>{output.innerHTML='';},
      sudo:()=>print('Nice try. gaurav is not in the sudoers file. This incident will be reported (jk).')
    };

    input.addEventListener('keydown',e=>{
      if(e.key!=='Enter')return;
      const raw=input.value;
      const val=raw.trim();
      print('root@jain:~$ '+raw);
      input.value='';
      if(!val)return;
      const parts=val.split(' ').filter(Boolean);
      const cmd=parts[0].toLowerCase();
      const arg=parts.slice(1).join(' ');

      if(cmd==='echo'){
        print(arg);
      }else if(cmd==='ls'){
        print(arg==='projects'?PROJECT_NAMES.join('\\n'):Object.keys(FILES).join('\\n')+'\\nprojects/');
      }else if(cmd==='cat'){
        if(!arg){print('usage: cat <file>');return;}
        if(FILES[arg])print(FILES[arg]);
        else if(PROJECT_NAMES.includes(arg)){openApp('projects');print('opening projects/'+arg+' in projects/ window ...');}
        else print('cat: '+arg+': No such file or directory');
      }else if(commands[cmd]){
        commands[cmd]();
      }else if(cmd==='exit'){
        closeWindow('terminal');
      }else{
        print(`command not found: ${cmd} — type 'help'`);
      }
    });

    setTimeout(()=>input.focus(),100);
    content.addEventListener('click',()=>input.focus());
  }

  function downloadResume(){
    const a=document.createElement('a');
    a.href='resume.pdf';
    a.download='Gaurav_Jain_Resume.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  window.addEventListener('resize',()=>{
    Object.values(openWindows).forEach(win=>{
      if(window.innerWidth<=760)return;
      const rect=win.getBoundingClientRect();
      if(rect.right>window.innerWidth-12)win.style.left=Math.max(0,window.innerWidth-win.offsetWidth-12)+'px';
      if(rect.bottom>window.innerHeight-52)win.style.top=Math.max(22,window.innerHeight-win.offsetHeight-52)+'px';
    });
  });

  document.addEventListener('mousemove',e=>{
    if(!cursor || window.matchMedia('(pointer:coarse)').matches)return;
    cursor.style.left=e.clientX+'px';
    cursor.style.top=e.clientY+'px';
  });

  document.addEventListener('mouseover',e=>{
    if(!cursor)return;
    if(e.target.closest('a,button,.icon,.titlebar,.resize-handle,.taskbar-tab'))cursor.classList.add('hover');
  });
  document.addEventListener('mouseout',e=>{
    if(!cursor)return;
    if(e.target.closest('a,button,.icon,.titlebar,.resize-handle,.taskbar-tab'))cursor.classList.remove('hover');
  });

  buildIcons();
  typeBoot();
})();
</script>
