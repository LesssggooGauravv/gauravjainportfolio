<style>
  html,
  body,
  *,
  *::before,
  *::after {
    cursor: none !important;
  }

  #cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 8px;
    height: 8px;
    background: var(--green);
    border-radius: 50%;
    pointer-events: none;
    z-index: 10001;
    transform: translate(-50%, -50%);
    transition:
      width 0.25s ease,
      height 0.25s ease,
      box-shadow 0.25s ease;
  }

  #cursor::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 22px;
    height: 22px;
    border: 2px solid rgba(255, 255, 255, 0.85);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition:
      width 0.25s ease,
      height 0.25s ease,
      border-color 0.25s ease;
  }

  #cursor.hover {
    width: 12px;
    height: 12px;
    box-shadow: 0 0 10px rgba(88, 214, 141, 0.45);
  }

  #cursor.hover::before {
    width: 34px;
    height: 34px;
    border-color: rgba(255, 255, 255, 1);
  }

  :root{
    --bg: #090d0b;
    --bg-panel: #0f1512;
    --bg-panel-2: #131a16;
    --bg-raised: #182018;
    --green: #58d68d;
    --green-dim: #2f6b4c;
    --green-bright: #8ff0b6;
    --amber: #e3b04b;
    --text: #c9d6cc;
    --text-dim: #6f8378;
    --text-faint: #445048;
    --red: #e0665f;
    --border: #24312a;
    --border-bright: #3c5347;
    --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
    --pixel: 'Press Start 2P', var(--mono);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:var(--mono);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--green-dim); color:#e8fff0; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:var(--bg-panel); }
  ::-webkit-scrollbar-thumb{ background:var(--border-bright); border-radius:0; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--green-dim); }

  /* ---------- CRT / scanline overlay ---------- */
  #crt{
    position:fixed; inset:0; pointer-events:none; z-index:9999;
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0.16) 1px, rgba(0,0,0,0) 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.45) 100%);
    mix-blend-mode:multiply;
    opacity:0.55;
  }
  #crt::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0) 4%);
    animation:flicker 6.5s infinite;
  }
  @keyframes flicker{
    0%,100%{opacity:1;} 92%{opacity:1;} 93%{opacity:0.85;} 94%{opacity:1;} 96%{opacity:0.9;} 97%{opacity:1;}
  }
  @media (prefers-reduced-motion: reduce){
    #crt::after{ animation:none; }
  }

  /* ---------- BOOT SCREEN ---------- */
  #boot{
    position:fixed; inset:0; background:#000; color:var(--green);
    font-size:14px; line-height:1.55; padding:28px 34px;
    z-index:500; white-space:pre-wrap; word-break:break-word;
    display:flex; flex-direction:column;
  }
  #boot .cursor{ display:inline-block; width:8px; height:15px; background:var(--green); vertical-align:middle; animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  #boot-skip {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 220px;
    padding: 18px 30px;

    border: 1px solid var(--border);
    background: transparent;

    color: var(--text);
    font-family: var(--mono);
    cursor: none !important;

    transition:
      border-color 0.25s ease,
      transform 0.25s ease,
      background 0.25s ease;
  }

  #boot-skip:hover {
    border-color: var(--green-dim);
    background: rgba(88, 214, 141, 0.04);
    transform: translateX(-50%) scale(1.04);
  }

  .boot-system {
    color: var(--green-bright);
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    margin-bottom: 18px;
  }

  .boot-action {
    color: var(--text);
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;

  }

  .boot-hint {
    margin-top: 10px;
    color: var(--text-faint);
    font-size: 10px;
  }

  @keyframes bootPulse {
    0%, 100% {
      opacity: 0.45;
    }

    50% {
      opacity: 1;
    }
  }

  #topbar .right{ display:flex; align-items:center; gap:16px; color:var(--text-dim); }

  .win-titlebar .dot{ width:8px; height:8px; flex:none; background:var(--green-dim); }
  .win.focused .win-titlebar .dot{ background:var(--green); }

  /* taskbar */
  #taskbar{

  /* terminal window contents */
  .term{ background:#070a08; font-size:13px; padding:14px 16px; height:100%; overflow-y:auto; }

  #mobile-note{ display:none; }
  @media (max-width:720px){
    #icons{ flex-direction:row; flex-wrap:wrap; left:10px; right:10px; top:40px; }
    .win{ left:6px !important; right:6px !important; width:auto !important; top:70px !important; }
  }
</style>

async function enterFullscreen() {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    }
  } catch (err) {
    console.log("Fullscreen unavailable:", err);
  }
}

function finishBoot(){
  if(bootDone) return;
  bootDone = true;
  bootEl.style.display = 'none';
  desktopEl.classList.add('on');
  openWindow('about');
}

function finishBoot(){

  desktopEl.classList.add('on');
  openWindow('about');
}

async function typeBoot(){
  for(const line of bootLines){
    if(bootDone) return;
    await typeLine(line);
    await sleep(line === "" ? 40 : 70);
  }
  await sleep(350);
  if(!bootDone) finishBoot();
}

function typeLine(line){
  return new Promise(resolve=>{
    let i = 0;
    const row = document.createElement('div');
    bootTextEl.appendChild(row);
    const iv = setInterval(()=>{
      if(bootDone){ clearInterval(iv); resolve(); return; }
      row.textContent = line.slice(0, i+1);
      i++;
      if(i > line.length){ clearInterval(iv); resolve(); }
    }, 8);
  });
}
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

document.getElementById('boot-skip').addEventListener('click', async () => {
    await enterFullscreen();
    finishBoot();
  });
document.addEventListener('keydown', async e => {
    if(!bootDone && (e.key === 'Enter' || e.key === ' ')) {
      await enterFullscreen();
      finishBoot();
    }
  }, {once:false});
typeBoot();

  const mm = String(d.getMinutes()).padStart(2,'0');
  const ss = String(d.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${hh}:${mm}:${ss}`;
}

/* =========================================================
   WINDOW MANAGER
========================================================= */
const layer = document.getElementById('windows-layer');
const taskbar = document.getElementById('taskbar');
const taskClock = document.getElementById('taskClock');
let zTop = 30;
const openWins = {}; // id -> {el, taskBtn}
let offsetCounter = 0;

function openWindow(id){
  if(openWins[id]){
    focusWindow(id);
    restoreIfMinimized(id);
    return;
  }
  if(id === 'resume'){ downloadResume(); return; }
  if(id === 'terminal'){ createTerminalWindow(); return; }

  const cfg = WINDOWS[id];
  if(!cfg) return;

  const el = document.createElement('div');
  el.className = 'win';
  const baseX = 150 + (offsetCounter % 5) * 26;
  const baseY = 60 + (offsetCounter % 5) * 22;
  offsetCounter++;
  el.style.left = baseX + 'px';
  el.style.top = baseY + 'px';
  el.style.width = Math.min(cfg.w, window.innerWidth - 40) + 'px';
  el.style.height = Math.min(cfg.h, window.innerHeight - 100) + 'px';

  el.innerHTML = `
    <div class="win-titlebar">
      <div class="ttl"><span class="dot"></span><span>${cfg.title}</span></div>
      <div class="win-controls">
        <button class="min" title="minimize">_</button>
        <button class="x" title="close">x</button>
      </div>
    </div>
    <div class="win-body">${cfg.body}</div>
    <div class="win-resize"></div>
  `;
  layer.appendChild(el);
  makeDraggable(el);
  makeResizable(el);
  el.addEventListener('mousedown', ()=>focusWindow(id));

  el.querySelector('.x').addEventListener('click', ()=>closeWindow(id));
  el.querySelector('.min').addEventListener('click', ()=>minimizeWindow(id));

  const taskBtn = document.createElement('div');
  taskBtn.className = 'tb-btn active';
  taskBtn.textContent = cfg.title.split(' — ')[0];
  taskBtn.addEventListener('click', ()=>{
    if(el.style.display === 'none'){ restoreIfMinimized(id); }
    else { focusWindow(id); }
  });
  taskbar.insertBefore(taskBtn, taskbar.querySelector('.tb-sep'));

  openWins[id] = {el, taskBtn};
  focusWindow(id);
}

function focusWindow(id){
  Object.entries(openWins).forEach(([k,v])=>{
    v.el.classList.toggle('focused', k===id);
    v.taskBtn.classList.toggle('active', k===id);
  });
  zTop++;
  openWins[id].el.style.zIndex = zTop;
}

function closeWindow(id){
  const w = openWins[id];
  if(!w) return;
  w.el.remove();
  w.taskBtn.remove();
  delete openWins[id];
}

function minimizeWindow(id){
  const w = openWins[id];
  if(!w) return;
  w.el.style.display = 'none';
  w.taskBtn.classList.remove('active');
}

function restoreIfMinimized(id){
  const w = openWins[id];
  if(!w) return;
  w.el.style.display = 'flex';
  focusWindow(id);
}

function makeDraggable(el){
  const bar = el.querySelector('.win-titlebar');
  let sx, sy, ox, oy, dragging = false;
  bar.addEventListener('mousedown', e=>{
    dragging = true;
    sx = e.clientX; sy = e.clientY;
    ox = el.offsetLeft; oy = el.offsetTop;
    e.preventDefault();
  });
  window.addEventListener('mousemove', e=>{
    if(!dragging) return;
    let nx = ox + (e.clientX - sx);
    let ny = oy + (e.clientY - sy);
    ny = Math.max(30, ny);
    el.style.left = nx + 'px';
    el.style.top = ny + 'px';
  });
  window.addEventListener('mouseup', ()=> dragging = false);
}

function makeResizable(el){
  const handle = el.querySelector('.win-resize');
  let sx, sy, sw, sh, resizing = false;
  handle.addEventListener('mousedown', e=>{
    resizing = true;
    sx = e.clientX; sy = e.clientY;
    sw = el.offsetWidth; sh = el.offsetHeight;
    e.stopPropagation(); e.preventDefault();
  });
  window.addEventListener('mousemove', e=>{
    if(!resizing) return;
    el.style.width = Math.max(300, sw + (e.clientX - sx)) + 'px';
    el.style.height = Math.max(200, sh + (e.clientY - sy)) + 'px';
  });
  window.addEventListener('mouseup', ()=> resizing = false);
}

document.querySelectorAll('.icon').forEach(ic=>{
  ic.addEventListener('dblclick', ()=> openWindow(ic.dataset.win));
  let tapped = false;
  ic.addEventListener('click', ()=>{
    if(tapped){ openWindow(ic.dataset.win); tapped=false; return; }
    tapped = true;
    setTimeout(()=> tapped=false, 400);
  });
});

      <div class="term" id="termOutput" style="flex:1;"></div>
      <div class="term-input-row" style="padding:6px 16px 12px;">

        <input id="termInput" autocomplete="off" spellcheck="false">
      </div>
    </div>
    <div class="win-resize"></div>
  `;
  layer.appendChild(el);
  makeDraggable(el);
  makeResizable(el);
  el.addEventListener('mousedown', ()=>focusWindow(id));
  el.querySelector('.x').addEventListener('click', ()=>closeWindow(id));
  el.querySelector('.min').addEventListener('click', ()=>minimizeWindow(id));

  const taskBtn = document.createElement('div');
  taskBtn.className = 'tb-btn active';
  taskBtn.textContent = 'terminal';
  taskBtn.addEventListener('click', ()=>{
    if(el.style.display === 'none'){ restoreIfMinimized(id); }
    else { focusWindow(id); }
  });
  taskbar.insertBefore(taskBtn, taskbar.querySelector('.tb-sep'));
  openWins[id] = {el, taskBtn};
  focusWindow(id);

  const out = el.querySelector('#termOutput');
  const input = el.querySelector('#termInput');

  // printTerm(out, "root@jain terminal — type 'help' to see available commands.\\n");
  printTerm(out,
    `root@jain
    -----------
    portfolio shell

    Type 'help' to explore.
    Try 'neofetch' for system info.
  `);
  input.focus();
  el.addEventListener('click', ()=> input.focus());

  const history = []; let hIdx = -1;

  input.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){
      const cmd = input.value;
      printTerm(out, `<span class="p1">root@jain</span><span class="p2">:~$</span> ${escapeHtml(cmd)}`);
      history.push(cmd); hIdx = history.length;
      runCommand(cmd.trim(), out);
      input.value = '';
      out.scrollTop = out.scrollHeight;
    } else if(e.key === 'ArrowUp'){
      if(hIdx > 0){ hIdx--; input.value = history[hIdx]; }
      e.preventDefault();
    } else if(e.key === 'ArrowDown'){
      if(hIdx < history.length-1){ hIdx++; input.value = history[hIdx]; } else { hIdx = history.length; input.value=''; }
      e.preventDefault();
    }
  });
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function runCommand(raw, out){
  if(raw === ''){ return; }
  const parts = raw.split(' ').filter(Boolean);
  const cmd = parts[0];
  const arg = parts.slice(1).join(' ');

  switch(cmd){
    case 'help':

      break;
    case 'whoami':
      printTerm(out, "gaurav — Software & AI/ML engineer, LNMIIT Jaipur '27. Speech ML, GANs, RAG, edge deployment.");
      break;
    case 'about': openWindow('about'); printTerm(out, "opening about.txt ..."); break;
    case 'projects':
      if(arg === ''){ openWindow('projects'); printTerm(out, "opening projects/ ..."); }
      break;
    case 'experience': openWindow('experience'); printTerm(out, "opening experience.log ..."); break;
    case 'education': openWindow('education'); printTerm(out, "opening education.md ..."); break;
    case 'skills': openWindow('skills'); printTerm(out, "opening skills.sh ..."); break;
    case 'contact': openWindow('contact'); printTerm(out, "opening contact.md ..."); break;
    case 'resume': downloadResume(); break;
    case 'github': printTerm(out, `→ <a class="lnk" href="${LINKS.github}" target="_blank">${LINKS.github}</a>`); break;
    case 'linkedin': printTerm(out, `→ <a class="lnk" href="${LINKS.linkedin}" target="_blank">${LINKS.linkedin}</a>`); break;
    case 'leetcode': printTerm(out, `→ <a class="lnk" href="${LINKS.leetcode}" target="_blank">${LINKS.leetcode}</a>`); break;
    case 'email': printTerm(out, `→ <a class="lnk" href="mailto:${LINKS.email}">${LINKS.email}</a>`); break;
    case 'ls':
      if(arg === 'projects'){
        printTerm(out, PROJECT_NAMES.join('\\n'));
      } else {
        printTerm(out, Object.keys(FILES).join('\\n') + '\\nprojects/');
      }
      break;
    case 'cat':
      if(!arg){ printTerm(out, 'usage: cat &lt;file&gt;'); break; }
      if(FILES[arg]){ printTerm(out, FILES[arg]); }
      else if(PROJECT_NAMES.includes(arg)){ openWindow('projects'); printTerm(out, `opening projects/${arg} in projects/ window ...`); }
      else { printTerm(out, `cat: ${escapeHtml(arg)}: No such file or directory`); }

      printTerm(out, `root@jain\\n-------------\\nOS: root@jain v2.7.3\\nHost: LNMIIT Jaipur, CCE '27\\nCGPA: 7.3/10\\nShell: skills.sh\\nCore: Python, C++, PyTorch\\nUptime: since 2023`);
      break;
    case 'clear': out.innerHTML = ''; break;
    case 'exit': closeWindow('terminal'); break;
    default:
      if(cmd === 'sudo'){
        printTerm(out, "Nice try. gaurav is not in the sudoers file. This incident will be reported (jk).");
      } else {
        printTerm(out, `command not found: ${escapeHtml(cmd)} — type 'help'`);

  }
}
